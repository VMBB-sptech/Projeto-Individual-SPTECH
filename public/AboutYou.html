<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre mim</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="fundo">
    <header class="cabecalho">

        <a href="index.html">
            <img src="assets/Imgs/LogoSite.png" alt="Logo sound space" class="logo">
        </a>

        <nav class="menu">
            <a href="index.html" class="destaque-colorido navPadding">Home</a>
            <a href="AboutMe.html" class="destaque-colorido navPadding" style="padding-left: 20px;">Sobre Mim</a>
            <a class="login-button destaque-colorido" href="Conta.html">Conta</a>
        </nav>

    </header>

    <div class="layout-principal">

        <nav class="barra-lateral">
            <a href="AboutYou.html" class="destaque-colorido link-lateral">Profile</a>
            <a href="Quiz.html" class="destaque-colorido link-lateral">Quiz</a>
            <a href="Leaderboard.html" class="destaque-colorido link-lateral">Leaderboard</a>
        </nav>

        <div class="conteudo-principal">
            <div>
                <div>
                    <span class="mensagem-titulo">Bem Vindo </span>
                    <h1 class="destaque-colorido" id="nome_usuario"> Nome do Usuario</h1>
                    <span class="mensagem-titulo"> ! </span>
                </div>
            </div>

            <!-- Divs para as KPI's -->
            <div class="kpi-row">
                <div class="card-neon">
                    <span class="kpi-texto">Acertos Totais</span>
                    <span class="kpi-valor" id="kpi_acertos"> ?? </span>
                </div>
                <div class="card-neon">
                    <span class="kpi-texto">Total de Tentativas</span>
                    <span class="kpi-valor" id="kpi_tentativas"> ?? </span>
                </div>
                <div class="card-neon roxo">
                    <span class="kpi-texto roxo">Precisão Média (Ultimas 10)</span>
                    <span class="kpi-valor" id="kpi_precisao"> ??%</span>
                </div>
                <div class="card-neon roxo">
                    <span class="kpi-texto roxo">Pontos Totais</span>
                    <span class="kpi-valor" id="kpi_pp"> ?? pp</span>
                </div>
            </div>

            <!-- Div para os graficos -->
            <div class="chartjs-grid">
                <div class="card-neon card-chart">
                    <span class="titulo-chart"> Player Points máximo por dificuldade</span>
                    <div class="caixa-chart">
                        <canvas id="GraficoDeBarra"></canvas>
                    </div>
                </div>

                <div class="card-neon roxo card-chart">
                    <span class="titulo-chart roxo"> Resumo das Ultimas Tentativas</span>
                    <div class="caixa-chart">
                        <canvas id="GraficoDeLinha"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

<script src="js/sessao.js"></script>
<script src="js/AboutYou.js"></script>
