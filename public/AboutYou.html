<head>

    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="fundo">
    <header class="cabecalho">

        <a href="index.html">
            <img src="assets/Imgs/LogoSite.png" alt="Logo sound space" class="logo">
        </a>

        <nav class="menu">
            <a href="index.html" class="destaque-colorido navPadding">Home</a>
            <a href="AboutMe.html" class="destaque-colorido navPadding" style="padding-left: 20px;">Sobre Mim</a>
            <a class="login-button destaque-colorido" href="Conta.html">Conta</a>
        </nav>

    </header>

    <div class="layout-principal">

        <nav class="barra-lateral">
            <a href="AboutYou.html" class="destaque-colorido link-lateral">Profile</a>
            <a href="Quiz.html" class="destaque-colorido link-lateral">Quiz</a>
            <a href="Leaderboard.html" class="destaque-colorido link-lateral">Leaderboard</a>

        <div class="conteudo-principal">
            <div>
                <div>
                    <h1 class="destaque-colorido" id="nome_usuario"> Nome do Usuario</h1>
                </div>
            </div>

            <!-- Divs para as KPI's -->
            <div class="kpi-row">
                <div class="card-neon">
                    <span class="kpi-texto">Acertos Totais</span>
                    <span class="kpi-valor" id="kpi_acertos"> ?? </span>
                </div>
                <div class="card-neon roxo">
                    <span class="kpi-texto roxo">Total de Tentativas</span>
                    <span class="kpi-valor" id="kpi_tentativas"> ?? </span>
                </div>
                <div class="card-neon">
                    <span class="kpi-texto">Precisão Média (Ultimos 10)</span>
                    <span class="kpi-valor" id="kpi_precisao"> ??%</span>
                </div>
                <div class="card-neon roxo">
                    <span class="kpi-texto roxo">Pontos Totais</span>
                    <span class="kpi-valor" id="kpi_pp"> ?? pp</span>
                </div>
            </div>

            <!-- Div para os graficos -->
            <div class="chartjs-grid"></div>
        </div>
    </div>
