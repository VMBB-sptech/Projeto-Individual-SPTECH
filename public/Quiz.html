<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/Quiz.js"></script>
    <script src="js/sessao.js"></script>
</head>

<body class="fundo2">
    <header class="cabecalho">
        <a href="index.html">
            <img src="assets/Imgs/LogoSite.png" alt="Logo sound space" class="logo">
        </a>
        <nav class="menu">
            <a href="index.html" class="destaque-colorido navPadding">Home</a>
            <a class="login-button destaque-colorido" href="Conta.html">Conta</a>
        </nav>

    </header>

    <div class="layout-principal">

        <nav class="barra-lateral">
            <a href="AboutYou.html" class="destaque-colorido link-lateral">Profile</a>
            <a href="Quiz.html" class="destaque-colorido link-lateral">Quiz</a>
            <a href="Leaderboard.html" class="destaque-colorido link-lateral">Leaderboard</a>
        </nav>

        <div class="conteudo-principal" style="align-items: center; display: flex; flex-direction: column;">

            <div class="titulo semi-conteudo" id="tituloQuiz">
                <h1 class="destaque-colorido">Quiz</h1>
            </div>

            <div class="janela-texto2 semi-conteudo" onclick="exibirCaixa()" id="botao" style="text-align: center;">
                Começar!
            </div>
            <div class="semi-conteudo jogo-container" id="containerDoJogo" style="display: none; flex-direction: column; text-align: center; gap: 20px;">

                <div id="pontuacaoDuranteJogo" style="display: flex; justify-content: space-around; font-weight: bold;">
                    <span style="color: #f166fe;">Pontuação: <span id="spanPP">0</span></span>
                    <span style="color: #4CAF50;">Acertos: <span id="spanCertas">0</span></span>
                    <span style="color: #ff9436;">Sequência: <span id="spanStreak">0</span></span>
                    <span style="color: #f44336;">Erros: <span id="spanErradas">0</span></span>
                </div>
                <div>
                    <span>Questão <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span></span>
                </div>

                <div>
                    <h3 id="spanQuestaoExibida" style="margin: 0; text-align: center; align-items: center;"></h3>
                </div>

                <div id="opcoes" style="display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;">
                    <div id="AlternativaA" onclick="selecionarOpcao(this)" class="alternativa-quiz"></div>
                    <div id="AlternativaB" onclick="selecionarOpcao(this)" class="alternativa-quiz"></div>
                    <div id="AlternativaC" onclick="selecionarOpcao(this)" class="alternativa-quiz"></div>
                    <div id="AlternativaD" onclick="selecionarOpcao(this)" class="alternativa-quiz"></div>
                </div>

                <div style="display: flex; justify-content: space-evenly; margin-top: 10px;">
                    <button onclick="submeter()" id="btnSubmeter" class="botao-dificuldade" style="color: white;">Responder</button>
                </div>
            </div>

            <div class="janela-texto semi-conteudo jogo-container" id="containerFinal" style="display: none; flex-direction: column; text-align: center; gap: 20px;">
                <h2 class="destaque-colorido" style="margin: 0;">Fim do Quiz!</h2>
                <h3 style="margin: 0;">Pontuação Final: <span id="spanPontuacaoFinal"></span></h3>
                <p id="msgFinal" style="font-weight: bold;"></p>
                <div>
                    <button onclick="tentarNovamente()" class="botao-dificuldade">Tentar Novamente</button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
